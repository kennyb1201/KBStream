# Dependency upgrades, the half of THIRD_PARTY_NOTICES.md that was missing:
# that file has always said "Dependabot (.github/dependabot.yml) opens the
# upgrade PRs", and until now the file did not exist, so nothing ever opened
# one and the pinned versions drifted years behind (see the audit that added
# this file).
#
# Deliberately conservative. This app ships a player built on media3, and its
# toolchain (AGP / Kotlin / Gradle) is pinned as one unit, so a wall of major
# bump PRs would be worse than useless: minor and patch updates are grouped
# into a single PR per ecosystem so they can be reviewed and landed together,
# while a MAJOR bump (okhttp 4 -> 5, retrofit 2 -> 3, sentry 7 -> 8, ktor 2 -> 3,
# supabase 2 -> 3, media3 across a minor, the toolchain) still arrives on its
# own, where it can be treated as the migration it is.
#
# Neither ecosystem's PRs are auto-merged; landing one still means the normal
# gates (ktlint, unit tests, Android Lint, both APKs) plus, for anything that
# touches playback, a device. .github/workflows/pr-checks.yml now runs the
# secret-free half of those gates on every pull request, so a bump is answered
# before it is merged instead of after it is on main.
#
# ---------------------------------------------------------------------------
# The floor everything Gradle-side is currently measured against
# ---------------------------------------------------------------------------
# AGP 9.4.1 · compileSdk 37 · minSdk 24 · Kotlin 2.4.20 · KSP 2.3.12 ·
# Gradle 9.8.0.
#
# This used to read AGP 8.6.0 · compileSdk 35 · Kotlin 2.0.21 · KSP
# 2.0.21-1.0.25, under which essentially nothing on the newer side fit - which
# is why the group below was scoped down instead of merged. That ceiling is
# gone: the toolchain moved, and the bumps it was blocking have landed
# (androidx.core 1.19.1, the Compose 1.12.1 BOM, tv-material 1.1.0, coil3
# 3.6.3, room 2.8.5, media3 1.11.1, supabase-kt 3.8.0, retrofit 3/okhttp 5).
# AGP 9.1.0+ and compileSdk 37 were prerequisites for those and are now met,
# and the Compose compiler shipping with Kotlin 2.x means a BOM bump is a
# version bump rather than the compiler migration it used to be.
#
# Nothing on the newer side is out of reach now. The last item was
# work-runtime 2.12, which declares minSdk 24 above the app's old floor of 23;
# the floor moved to 24 and 2.12 landed with it. Note what the floor does and
# does not decide: it is about which DEVICES an APK installs on, not about
# which library versions are current, so a future bump that wants 25 or 26 is
# still a product decision and not a routine drop.
#
# The excludes below stay even now that these versions fit, for the reason they
# were added: they are the player/UI-critical lines (the toolchain, media3,
# Compose, tv-material, coil), and the update-types list calls Kotlin 2.4 ->
# 2.5, media3 1.11 -> 1.12 and tv-material 1.0 -> 1.1 "minor" updates, so
# without them a routine patch drop would arrive carrying a migration.
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      gradle-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        # Dependabot's semver reading calls Kotlin 2.0 -> 2.4, media3 1.9 ->
        # 1.11 and tv-material 1.0 -> 1.1 "minor" updates, so this group swept
        # the toolchain and the player into what looked like a routine patch
        # drop. They are not routine, and each one is excluded here so it
        # arrives as its own PR where it can be read as the migration it is.
        exclude-patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
          - "com.google.devtools.ksp"
          - "androidx.media3*"
          - "androidx.tv*"
          - "androidx.compose*"
          - "androidx.core*"
          - "androidx.work*"
          - "io.coil-kt*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
