name: Build KBStream APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
      SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
      TRAILER_PROXY_URL: ${{ secrets.TRAILER_PROXY_URL }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore release keystore
        run: |
          echo "${{ secrets.KBSTREAM_KEYSTORE_BASE64 }}" | base64 --decode > app/kbstream-release.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
          KBSTREAM_STORE_FILE: kbstream-release.jks
          KBSTREAM_STORE_PASSWORD: ${{ secrets.KBSTREAM_KEYSTORE_PASSWORD }}
          KBSTREAM_KEY_ALIAS: ${{ secrets.KBSTREAM_KEY_ALIAS }}
          KBSTREAM_KEY_PASSWORD: ${{ secrets.KBSTREAM_KEY_PASSWORD }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kbstream-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: kbstream-release-signed
          path: app/build/outputs/apk/release/*.apk
