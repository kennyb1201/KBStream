name: Build KBStream APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
      SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
      # Every CI build gets a strictly increasing versionCode (run number) and a
      # versionName that identifies the exact commit, so device bug reports map
      # to the build that produced them.
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.2.${{ github.run_number }}
      GIT_SHA: ${{ github.sha }}
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package set includes the legacy `tools`
          # package, which Google removed from the SDK repository (runs fail
          # with "Failed to find package 'tools'"). platform-tools is the
          # only extra needed here; AGP fetches platforms/build-tools during
          # the build once licenses are accepted (default input).
          packages: platform-tools

      - name: Restore release keystore
        run: |
          echo "${{ secrets.KBSTREAM_KEYSTORE_BASE64 }}" | base64 --decode > app/kbstream-release.jks
          test -s app/kbstream-release.jks || echo "::warning::KBSTREAM_KEYSTORE_BASE64 secret is empty - the signed release step will be skipped or fail"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Unit-test gate: run the JVM tests (KidsMode rating matrix, kids
      # catalog invariants) BEFORE spending time on the APK builds. A
      # red test fails the workflow with the HTML report attached.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
          KBSTREAM_STORE_FILE: kbstream-release.jks
          KBSTREAM_STORE_PASSWORD: ${{ secrets.KBSTREAM_KEYSTORE_PASSWORD }}
          KBSTREAM_KEY_ALIAS: ${{ secrets.KBSTREAM_KEY_ALIAS }}
          KBSTREAM_KEY_PASSWORD: ${{ secrets.KBSTREAM_KEY_PASSWORD }}

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kbstream-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: kbstream-release-signed
          path: app/build/outputs/apk/release/*.apk

      # Self-update feed: every main-branch build is published as the
      # "latest" GitHub release with the signed APK + metadata.json, which
      # the app's AppUpdater polls (permissions: contents write). Release
      # names are the stamped build identity from the version-stamping step.
      - name: Prepare metadata
        if: github.ref == 'refs/heads/main'
        run: |
          echo "{\"versionCode\": ${GITHUB_RUN_NUMBER}, \"versionName\": \"0.2.${GITHUB_RUN_NUMBER}\"}" > metadata.json
          cat metadata.json

      - name: Delete in-progress release tag
        if: github.ref == 'refs/heads/main'
        run: gh release delete latest --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish latest release (self-update feed)
        if: github.ref == 'refs/heads/main'
        run: |
          gh release create latest \
            --title "KBStream 0.2.${GITHUB_RUN_NUMBER} (build ${GITHUB_RUN_NUMBER})" \
            --notes "Automated build from commit ${GITHUB_SHA}. Install from the app: Settings → Check for updates." \
            --latest
          gh release upload latest \
            app/build/outputs/apk/release/*.apk \
            metadata.json
        env:
          GH_TOKEN: ${{ github.token }}
