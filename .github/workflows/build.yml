name: Build KBStream APK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  # A push to main runs every gate and builds both APKs, but publishes
  # nothing: the self-update feed is a separate, deliberate act.
  push:
    branches: [main]
    # ...which is what a version tag is for. Pushing v0.2.123 (or dispatching
    # this workflow by hand) is what puts a build in front of every install.
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      # Escape hatch for the rare case where the FFmpeg cross-compile is broken
      # by something outside this repo (an upstream tarball moving, a runner
      # image change). Without it a missing extension fails the whole job, so
      # there would be no way to ship a release at all until it is fixed.
      allow_missing_ffmpeg:
        description: "Ship the release even if the FFmpeg video extension is missing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      # Client id only: Simkl auth is the PIN (device) flow, which is a
      # public-client flow and never sends a secret. There is no
      # SIMKL_CLIENT_SECRET secret to pass, and no buildConfigField to receive
      # one (see app/build.gradle.kts).
      SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      # Authenticates the Sentry Gradle plugin's R8-mapping upload so release
      # crash traces arrive deobfuscated (real class/method names).
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_PROJECT: android
      SENTRY_ORG: kbstream
      # sentry-cli takes the region from the auth token, and this token is a
      # sentry.io (US) one, so us.sentry.io here only produced "Using
      # https://sentry.io (embedded in token) rather than manually-configured
      # URL https://us.sentry.io" on every upload. The DSN the app itself uses
      # is a separate secret and is unaffected by this.
      SENTRY_URL: https://sentry.io
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
      # Every CI build gets a strictly increasing versionCode (the run number),
      # which is what installs compare and what a device bug report maps back to
      # a build. The versionName is NOT the build number: it is the release's
      # tag (see "Compute version name" below), because a version is read by
      # people and "0.2.4631" is a run number wearing a version's clothes.
      VERSION_CODE: ${{ github.run_number }}
      GIT_SHA: ${{ github.sha }}
      # The Kotlin compiler runs inside the Gradle daemon (gradle.properties
      # sets kotlin.compiler.execution.strategy=in-process), and gradle.properties
      # sizes that daemon for the 4 GiB dev container, where a clean compile
      # only just fits. A runner has far more RAM, and running out of it is
      # exactly what killed this build ("Exception during IR lowering / The
      # root cause java.lang.OutOfMemoryError"), so the daemon heap is raised
      # via -D below. GRADLE_OPTS is deliberately not used for this: it sizes
      # the throwaway client JVM and never reaches the daemon that compiles.
      #
      # ActiveProcessorCount=4 overrides gradle.properties' =2 (tuned for the
      # 2-CPU dev container), so the compiler, R8 and dex/merge all size their
      # internal pools for the runner's 4 cores. --max-workers below lifts the
      # container's org.gradle.workers.max=1 for the same reason. Both only
      # change HOW FAST the work runs - neither skips or reuses a task.
      GRADLE_DAEMON_JVMARGS: "-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:ActiveProcessorCount=4 -XX:ReservedCodeCacheSize=256m"
      GRADLE_MAX_WORKERS: "4"

      # Optional video-enabled FFmpeg extension: the media3 tag to build it
      # against (MUST match app/build.gradle.kts) and the NDK it is linked
      # with. See scripts/build_ffmpeg_video.sh.
      #
      # The NDK is r28c because media3 1.10 moved 16 KB ELF alignment off the
      # explicit "-Wl,-z,max-page-size=16384" linker flag and onto the NDK's
      # ANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES property, which only r27+ honours.
      # Under r26 that argument is ignored, so the extension would be linked
      # with 4 KB page alignment and crash on 16 KB page-size devices.
      MEDIA3_TAG: "1.11.1"
      NDK_VERSION: "28.2.13676358"
      
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history, not the default single-commit clone: the publish guard
          # at the end of the job asks `git merge-base --is-ancestor` whether
          # the commit that is currently published is already contained in this
          # one, which a depth-1 clone cannot answer.
          fetch-depth: 0

      # The release's version, from its tag: pushing v0.5 publishes versionName
      # "0.5". A branch build or a manual dispatch gets "0.0.0-dev" so an
      # unreleased build can never be mistaken for a release. versionCode stays
      # the run number (a tag carries no ordering the installed app can read).
      - name: Compute version name
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=0.0.0-dev" >> "$GITHUB_ENV"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: "17"
          distribution: temurin

      # Dependency caching only - deliberately NOT the Gradle build cache.
      #
      # A fresh runner re-downloads the entire AGP/Compose/media3/Supabase/
      # NewPipe dependency graph (hundreds of MB across google(), mavenCentral()
      # and jitpack.io) into an empty Gradle home on every run; restoring
      # ~/.gradle/caches skips that, and nothing else.
      #
      # What is NOT cached is the point: app/build is never restored, so
      # :app:compileDebugKotlin, :app:compileReleaseKotlin, dexing and R8 all
      # execute for real on every single run, and org.gradle.caching is left
      # off so the build cache cannot answer a task with a previously-produced
      # output either. "Faster" here must never mean "compiled less".
      #
      # The last two paths follow Gradle's own layout: since Gradle 9 the
      # per-version cache is caches/<gradle version>/ (the exploded AARs live at
      # caches/9.8.0/transforms), and the old top-level transforms-4 / 8.7
      # directories no longer exist. That path has to be renamed with the
      # wrapper every time: a stale version here restores nothing and re-pays
      # the whole transform step. Naming a path that is never written is not
      # an error, just a silent loss of the biggest saving here.
      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
            ~/.gradle/caches/9.8.0
            ~/.gradle/wrapper/dists
          # Keyed on the files that decide the resolved dependency graph, so a
          # dependency change (or a Gradle upgrade) misses and re-resolves.
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # The action's default package set includes the legacy `tools`
          # package, which Google removed from the SDK repository (runs fail
          # with "Failed to find package 'tools'"). platform-tools is the
          # only extra needed here; AGP fetches platforms/build-tools during
          # the build once licenses are accepted (default input).
          packages: platform-tools

      # --- Optional software video decoding ---------------------------------
      # Builds the video-enabled media3 FFmpeg decoder extension into
      # libs/media3-ffmpeg-decoder.aar, which the app build picks up
      # automatically (see the FFmpeg block in app/build.gradle.kts). The
      # four-ABI cross-compile is tens of minutes cold, so both the FFmpeg
      # static libs and the media3 checkout are cached: a warm run only
      # relinks the JNI wrapper.
      #
      # continue-on-error is deliberate: these steps must not fail the job on
      # their own, because the AAR is optional. Whether the absence is
      # acceptable is decided later by the "Verify FFmpeg extension" step,
      # which fails the job unless allow_missing_ffmpeg was set for the run.
      - name: Free disk space for the FFmpeg build
        continue-on-error: true
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost

      # The compiled FFmpeg static libs bake the decoder list, the FFmpeg ref
      # and the native API level into the binary, so a cached build is only
      # reusable while all three are unchanged. This signature covers them and
      # sits BEFORE the script hash in both the key and the restore-keys
      # prefix, because restore-keys is a PREFIX match: with the old broad
      # prefix, editing the decoder list still restored the previous build, the
      # script printed "FFmpeg static libs already built" and configure never
      # re-ran -- so a newly added decoder would silently never reach the AAR
      # while CI stayed green.
      #
      # The effective NDK is not derived here: see the ANDROID_NDK pin in the
      # build step below, and the cache keys on NDK_VERSION directly.
      - name: Compute FFmpeg build signature
        id: decoder_sig
        run: |
          sig="$(sed -n -e '/^ENABLED_DECODERS=(/,/^)/p' \
                       -e '/^FFMPEG_TAG=/p' \
                       -e '/^ANDROID_API=/p' \
                       scripts/build_ffmpeg_video.sh \
                 | tr -d '[:space:]' | sha256sum | cut -c1-16)"
          echo "sig=${sig}" >> "$GITHUB_OUTPUT"
          echo "build signature: ${sig}"

      - name: Cache FFmpeg extension build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/ffmpeg-ext
          # v2: the v1 entries cached a media3 checkout built when the script
          # looked for the AAR in the wrong place (build/, not media3's
          # buildout/); restoring one would keep the stale build alive, so the
          # prefix is bumped to force one clean rebuild under the fixed script.
          #
          # The signature segment is new, so no existing v2 entry matches it:
          # the first run after this change does one full cold cross-compile and
          # then caches under the corrected key. That one rebuild is the price
          # of making the cache honest -- the old entries were built from the
          # previous decoder list and cannot be trusted.
          # NDK_VERSION is part of the key too: the toolchain now pinned by the
          # build step compiles the .a files, so a different NDK must not
          # restore a build made by the old one.
          key: ffmpeg-ext-v2-${{ runner.os }}-${{ env.MEDIA3_TAG }}-${{ steps.decoder_sig.outputs.sig }}-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/build_ffmpeg_video.sh') }}
          restore-keys: |
            ffmpeg-ext-v2-${{ runner.os }}-${{ env.MEDIA3_TAG }}-${{ steps.decoder_sig.outputs.sig }}-${{ env.NDK_VERSION }}-

      - name: Build FFmpeg video extension (optional)
        continue-on-error: true
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;${NDK_VERSION}" "cmake;3.22.1"
          # The runner image exports ANDROID_NDK pointing at a preinstalled NDK,
          # and the build script prefers it over NDK_VERSION. So this step
          # installed ${NDK_VERSION} and then compiled FFmpeg with the image's
          # preinstalled NDK, while the script pinned media3's ndkVersion to
          # ${NDK_VERSION}:
          # the .a files and the CMake link that consumes them ended up on
          # different toolchains, which is exactly what the script's own
          # ndkVersion comment exists to prevent. Pin the whole build to the
          # version declared and installed here.
          export ANDROID_NDK="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          if [[ ! -d "$ANDROID_NDK" ]]; then
            echo "::error::NDK ${NDK_VERSION} missing at ${ANDROID_NDK}; refusing to silently build with a different toolchain"
            exit 1
          fi
          bash scripts/build_ffmpeg_video.sh

      # Kept even when the build failed: the log above is the only record of
      # why, and a successful run's AAR is worth downloading on its own for a
      # local device test.
      - name: Upload FFmpeg extension (optional)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: media3-ffmpeg-decoder-video
          path: libs/media3-ffmpeg-decoder.aar
          if-no-files-found: ignore
          retention-days: 30

      # The build and upload steps above are both continue-on-error, so a
      # failed cross-compile used to leave a GREEN run with no artifact and no
      # explanation -- which is exactly how a broken symbol check shipped
      # releases without video decoding for several runs without anyone
      # noticing. The absence is therefore a hard failure by default: this step
      # exits non-zero, the job stops, and no release is published, so the
      # failure is impossible to miss.
      #
      # A missing extension is never a code bug in this repo's build -- the AAR
      # is built from an upstream tag by an upstream script, so a manual run can
      # set allow_missing_ffmpeg to ship the release without software decoding
      # instead of blocking on an upstream break.
      - name: Verify FFmpeg extension was produced
        if: always()
        env:
          ALLOW_MISSING_FFMPEG: ${{ inputs.allow_missing_ffmpeg || false }}
        run: |
          if [[ -s libs/media3-ffmpeg-decoder.aar ]]; then
            echo "media3-ffmpeg-decoder.aar built: $(wc -c < libs/media3-ffmpeg-decoder.aar) bytes"
            exit 0
          fi
          message="media3-ffmpeg-decoder.aar was not produced, so this release's APK would ship with no FFmpeg extension at all: ExoPlayer would have no software video decoder, and the audio codecs MediaCodec does not guarantee would only be playable through the MPV engine. See the 'Build FFmpeg video extension (optional)' step above."
          if [[ "$ALLOW_MISSING_FFMPEG" == "true" ]]; then
            echo "::warning::${message} Continuing anyway because allow_missing_ffmpeg was set."
            exit 0
          fi
          echo "::error::${message} Re-run with allow_missing_ffmpeg if this is an upstream problem, not a regression."
          exit 1

      # --- Optional ASS/SSA subtitle rendering ------------------------------
      # Builds libass plus FreeType, HarfBuzz, fontconfig, fribidi and expat for
      # the app's ABIs, links them into the JNI bridge in scripts/libass-jni,
      # and drops the result at app/src/main/jniLibs/<abi>/libassjni.so -- a
      # default Gradle source set, so the APK packages it with no build-file
      # wiring.
      #
      # continue-on-error, and a WARNING-only check, unlike the FFmpeg block
      # above. The two are opposites in kind: without the FFmpeg extension
      # ExoPlayer loses its software video decoder outright, whereas a missing
      # libass only leaves an .ass SIDECAR on the flattened-cue path it already
      # uses (AssNative.available is false, the text renderer takes over). It
      # would be wrong to block every release on a brand-new cross-compile in
      # exchange for a cosmetic regression -- the string of release-less runs
      # the FFmpeg comment describes is exactly the failure to avoid here.
      #
      # Once a run has produced the .so, tightening the check below to the
      # FFmpeg block's hard failure (exit 1) is the right follow-up.
      - name: Cache the libass dependency prefixes
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build/libass-ext
          # Covers the script and the JNI sources: both change what the
          # dependency prefixes and the linked library must contain. Keyed on
          # NDK_VERSION for the same reason the FFmpeg key is -- these are
          # static archives produced by one toolchain and must not be reused
          # by another.
          key: libass-jni-v1-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ hashFiles('scripts/build_libass.sh', 'scripts/libass-jni/**') }}
          restore-keys: |
            libass-jni-v1-${{ runner.os }}-${{ env.NDK_VERSION }}-

      - name: Build libass JNI library (optional)
        continue-on-error: true
        run: |
          # Six autotools/meson/cmake projects: the runner image does not ship
          # all of their prerequisites.
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            autoconf automake libtool pkg-config gettext meson ninja-build
          SDKMANAGER="$(command -v sdkmanager || echo "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "ndk;${NDK_VERSION}" "cmake;3.22.1"
          # Same trap as the FFmpeg block: the runner exports ANDROID_NDK
          # pointing at a preinstalled NDK, and the script prefers it over
          # NDK_VERSION. Pin the whole build to the version installed here so
          # the static archives and the CMake link that consumes them are the
          # same toolchain.
          export ANDROID_NDK="${ANDROID_HOME}/ndk/${NDK_VERSION}"
          if [[ ! -d "$ANDROID_NDK" ]]; then
            echo "::error::NDK ${NDK_VERSION} missing at ${ANDROID_NDK}; refusing to silently build with a different toolchain"
            exit 1
          fi
          bash scripts/build_libass.sh

      # Kept even when the build failed: the log is the only record of why, and
      # a successful run's .so is worth downloading on its own for a device
      # test of the ASS overlay.
      - name: Upload libass JNI library (optional)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: libass-jni
          path: app/src/main/jniLibs
          if-no-files-found: ignore
          retention-days: 30

      # A warning, not the FFmpeg step's failure: see the block comment above.
      # It still warns with the byte count in the log, so a build that lost the
      # overlay is distinguishable from one that shipped it.
      - name: Check whether libass was produced
        if: always()
        run: |
          if [[ -s app/src/main/jniLibs/arm64-v8a/libassjni.so ]]; then
            echo "libassjni.so built: $(wc -c < app/src/main/jniLibs/arm64-v8a/libassjni.so) bytes"
            exit 0
          fi
          echo "::warning::libassjni.so was not produced, so this build renders .ass sidecars as flattened cues on the ExoPlayer engine (the MPV engine still typesets them). See the 'Build libass JNI library (optional)' step above."

      - name: Restore release keystore
        run: |
          echo "${{ secrets.KBSTREAM_KEYSTORE_BASE64 }}" | base64 --decode > app/kbstream-release.jks
          test -s app/kbstream-release.jks || echo "::warning::KBSTREAM_KEYSTORE_BASE64 secret is empty - the signed release step will be skipped or fail"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Dead-import gate. The ktlint plugin is configured down to a single
      # rule (unused imports - see .editorconfig and app/build.gradle.kts), so
      # a failure here means exactly one thing: an import nothing references
      # was left behind. The compiler accepts those silently, which is how
      # several hundred accumulated before they were swept out by hand; this
      # stops the next few hundred arriving. `./gradlew ktlintFormat` fixes a
      # failure locally.
      #
      # It runs before the tests because it takes seconds rather than minutes,
      # so a tidy-up failure costs the least time here - and because a
      # prepublish gate that can fail on a release push is the only place it is
      # guaranteed to be seen.
      - name: Check for dead imports (ktlint)
        run: ./gradlew ktlintCheck --stacktrace --max-workers="$GRADLE_MAX_WORKERS" -Dorg.gradle.jvmargs="$GRADLE_DAEMON_JVMARGS"
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"

      # Unit-test gate: run the JVM tests (KidsMode rating matrix, kids
      # catalog invariants) BEFORE spending time on the APK builds. A
      # red test fails the workflow with the HTML report attached.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --max-workers="$GRADLE_MAX_WORKERS" -Dorg.gradle.jvmargs="$GRADLE_DAEMON_JVMARGS"
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Upload test report (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

      # The Android Lint gate. It runs here and not on a developer machine on
      # purpose: lint's whole-source analysis on a tree this size needs more
      # memory than the dev container has, where it OOM-kills the Gradle daemon
      # mid-run, so CI is the only place it can be relied on to have run.
      #
      # It follows the tests rather than leading them because the tests are the
      # stronger signal and take a fraction of the time - and it precedes both
      # APK builds so an error fails the run before any artifact is produced.
      # Severity policy is in the lint block of app/build.gradle.kts: errors
      # fail, warnings are reported and uploaded below.
      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace --max-workers="$GRADLE_MAX_WORKERS" -Dorg.gradle.jvmargs="$GRADLE_DAEMON_JVMARGS"
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"

      # Lint's report is the whole point of the step above when it fails, and
      # an artifact is the only way to read it without a local reproduction.
      - name: Upload lint report (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace --max-workers="$GRADLE_MAX_WORKERS" -Dorg.gradle.jvmargs="$GRADLE_DAEMON_JVMARGS"
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"

      # The Sentry mapping-upload task is excluded here so a Sentry outage
      # or auth problem can never fail the build and block the APK. It runs
      # separately below as a best-effort step.
      - name: Build signed release APK
        run: ./gradlew assembleRelease -x uploadSentryProguardMappingsRelease --stacktrace --max-workers="$GRADLE_MAX_WORKERS" -Dorg.gradle.jvmargs="$GRADLE_DAEMON_JVMARGS"
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
          KBSTREAM_STORE_FILE: kbstream-release.jks
          KBSTREAM_STORE_PASSWORD: ${{ secrets.KBSTREAM_KEYSTORE_PASSWORD }}
          KBSTREAM_KEY_ALIAS: ${{ secrets.KBSTREAM_KEY_ALIAS }}
          KBSTREAM_KEY_PASSWORD: ${{ secrets.KBSTREAM_KEY_PASSWORD }}

      # Google Play requires every native library in a release to be 16 KB page
      # aligned (deadline Feb 1 2027), and nothing upstream guarantees it for a
      # THIRD-PARTY prebuilt .so. libmpv is pinned to a build verified 16 KB
      # aligned and the FFmpeg extension is linked with NDK r28c, but
      # sentry-native ships its own .so with no such pin - so every packaged
      # library is checked here and the run fails on any that is not, before a
      # release can be published. A 16 KB-aligned object reports 0x4000 (or
      # larger) on its LOAD segments; a 4 KB one reports 0x1000.
      #
      # Only the 64-BIT ABIs are checked, because only they are required to be
      # 16 KB aligned: armeabi-v7a is 32-bit and legitimately carries 4 KB
      # LOAD segments, so including it (as this check first did) failed every
      # release over libplayer.so / libffmpegJNI.so / libc++_shared.so - three
      # libraries Google never asks to be re-aligned - while arm64-v8a, the
      # ABI that actually matters here, was already clean.
      - name: Verify 16 KB page alignment of native libraries
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/release/*.apk | head -n1)"
          echo "Checking native libraries in $APK"
          rm -rf /tmp/apk-libs && mkdir -p /tmp/apk-libs
          unzip -o -q "$APK" 'lib/*' -d /tmp/apk-libs
          fail=0
          checked=0
          for abi in arm64-v8a x86_64; do
            dir="/tmp/apk-libs/lib/$abi"
            [ -d "$dir" ] || continue
            while IFS= read -r so; do
              checked=$((checked + 1))
              while IFS= read -r align; do
                case "$align" in
                  # Positively-detected 4 KB (or smaller) alignment is the only
                  # failure, so a parsing quirk cannot spuriously block a release.
                  0x1000|0x800|0x400|0x200)
                    echo "::error file=$so::LOAD segment not 16 KB aligned ($align)"
                    fail=1
                    ;;
                esac
              done < <(readelf -lW "$so" | awk '/^[[:space:]]*LOAD/{print $NF}')
            done < <(find "$dir" -name '*.so' | sort)
          done
          # A vacuous pass is worse than a failure: if the APK layout moved and
          # nothing was checked, this gate would silently stop guarding the
          # release.
          if [ "$checked" -eq 0 ]; then
            echo "::error::no 64-bit native libraries found in $APK; the layout changed and this check would be vacuous"
            exit 1
          fi
          if [ "$fail" -ne 0 ]; then
            echo "One or more 64-bit native libraries are not 16 KB page aligned."
            exit 1
          fi
          echo "All $checked packaged 64-bit native libraries are 16 KB page aligned."

      # Best-effort R8 mapping upload: needs an upload-capable Sentry token
      # (org auth token). With the wrong/read-only token this 403s and is
      # logged as a warning - the APK from the step above is still published.
      # Same --max-workers/-Dorg.gradle.jvmargs as the steps above on purpose:
      # matching daemon arguments mean this reuses the daemon the release
      # build already started (the mapping-upload task itself is then
      # up-to-date or a short upload) instead of booting a second JVM.
      - name: Upload Sentry mappings (best-effort)
        if: success()
        continue-on-error: true
        run: ./gradlew uploadSentryProguardMappingsRelease --stacktrace --max-workers="$GRADLE_MAX_WORKERS" -Dorg.gradle.jvmargs="$GRADLE_DAEMON_JVMARGS"
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
          KBSTREAM_STORE_FILE: kbstream-release.jks
          KBSTREAM_STORE_PASSWORD: ${{ secrets.KBSTREAM_KEYSTORE_PASSWORD }}
          KBSTREAM_KEY_ALIAS: ${{ secrets.KBSTREAM_KEY_ALIAS }}
          KBSTREAM_KEY_PASSWORD: ${{ secrets.KBSTREAM_KEY_PASSWORD }}

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kbstream-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload signed release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kbstream-release-signed
          path: app/build/outputs/apk/release/*.apk

      # ─── Self-update feed ────────────────────────────────────────────────
      # This is the only way a build reaches installs: the "latest" GitHub
      # release carries the signed APK + metadata.json, which the app's
      # AppUpdater polls (permissions: contents write). Release names are the
      # stamped build identity from the version-stamping step.
      #
      # It is deliberately NOT published on every push to main any more.
      # Publishing on push meant the feed moved whenever anyone pushed, so
      # there was no point at which a release could be said to have been cut,
      # and no way to hold an experiment back from every install while still
      # testing it. Everything above still runs on every push to main; the
      # publish steps below run on a version tag or a manual dispatch.
      #
      # The guard exists because the version is the run number, and a run
      # number is not a commit order: re-running an OLDER commit produces a
      # HIGHER run number, and the app only compares versionCode (it cannot see
      # commits), so it would offer that older build to every device as an
      # upgrade. A publish therefore needs both a higher versionCode AND a
      # currently published commit that this commit already contains.
      - name: Guard against publishing a stale build
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          mkdir -p /tmp/published
          if ! gh release download latest --pattern metadata.json --dir /tmp/published --clobber 2>/dev/null; then
            echo "No published 'latest' release yet - nothing to compare against."
            exit 0
          fi
          cat /tmp/published/metadata.json
          PREVIOUS_CODE="$(jq -r '.versionCode // 0' /tmp/published/metadata.json)"
          if (( ${VERSION_CODE} <= PREVIOUS_CODE )); then
            echo "::error::this run stamps versionCode ${VERSION_CODE}, which is not above the published ${PREVIOUS_CODE}; installs compare versionCode, so this build would never be offered."
            exit 1
          fi
          # gitSha is absent on a metadata.json written before it was added, in
          # which case only the versionCode check above applies.
          PREVIOUS_SHA="$(jq -r '.gitSha // ""' /tmp/published/metadata.json)"
          if [[ -z "$PREVIOUS_SHA" || "$PREVIOUS_SHA" == "$HEAD_SHA" ]]; then
            echo "Published build: ${PREVIOUS_SHA:-unknown (predates gitSha)}; versionCode advanced to ${VERSION_CODE}."
            exit 0
          fi
          if git merge-base --is-ancestor "$PREVIOUS_SHA" "$HEAD_SHA"; then
            echo "Published build $PREVIOUS_SHA is contained in $HEAD_SHA - this is a newer build."
            exit 0
          fi
          echo "::error::this commit ($HEAD_SHA) does not contain the published build ($PREVIOUS_SHA), so publishing would hand every install an older build under a higher versionCode. Dispatch the workflow from a commit that contains $PREVIOUS_SHA."
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

      # The release body IS the update-notes text: AppUpdater reads it into
      # UpdateState.Available.notes and Settings renders it above the Install
      # action. It used to be a fixed sentence naming the commit, which carried
      # nothing a user could act on - so a published build now lists the commits
      # it contains, taken from the same published gitSha the guard above reads.
      - name: Compose release notes
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          NOTES_FILE=/tmp/release-notes.md
          # The guard step already downloaded this; absent means no release has
          # ever been published, in which case there is no "since" to list.
          PREVIOUS_SHA="$(jq -r '.gitSha // ""' /tmp/published/metadata.json 2>/dev/null || true)"
          # A cap, because this is rendered in a Settings row: a publish after a
          # long gap would otherwise paste the whole repository into it.
          LIMIT=20
          CHANGES=""
          if [[ -n "$PREVIOUS_SHA" && "$PREVIOUS_SHA" != "$HEAD_SHA" ]] &&
             git merge-base --is-ancestor "$PREVIOUS_SHA" "$HEAD_SHA" 2>/dev/null; then
            TOTAL="$(git rev-list --count --no-merges "$PREVIOUS_SHA..$HEAD_SHA")"
            CHANGES="$(git log --no-merges --pretty=format:'- %s' "$PREVIOUS_SHA..$HEAD_SHA" | head -n "$LIMIT")"
            if (( TOTAL > LIMIT )); then
              CHANGES="${CHANGES}"$'\n'"...and $(( TOTAL - LIMIT )) more."
            fi
          fi
          {
            if [[ -n "$CHANGES" ]]; then
              echo "What's new in this build:"
              echo
              echo "$CHANGES"
            else
              echo "Automated build from commit ${HEAD_SHA}."
            fi
            echo
            echo "Install from the app: Settings -> Check for updates."
          } > "$NOTES_FILE"
          cat "$NOTES_FILE"

      - name: Prepare metadata
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          # The APK the app will download, excluding any unsigned output.
          APK="$(ls app/build/outputs/apk/release/*.apk | grep -v unsigned | head -1)"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          # gitSha is for CI, not for the app: AppUpdater reads the fields it
          # names (versionCode / versionName / sha256) and ignores the rest, so
          # adding it cannot affect an installed build - and the guard step
          # above reads it back on the next publish.
          # git rev-parse HEAD, not GITHUB_SHA: for an annotated tag GITHUB_SHA
          # is the tag object, which is not a commit for the ancestor check.
          echo "{\"versionCode\": ${GITHUB_RUN_NUMBER}, \"versionName\": \"${VERSION_NAME}\", \"sha256\": \"$SHA\", \"gitSha\": \"$(git rev-parse HEAD)\"}" > metadata.json
          cat metadata.json

      - name: Delete in-progress release tag
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: gh release delete latest --yes --cleanup-tag 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish latest release (self-update feed)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          gh release create latest \
            --title "KBStream ${VERSION_NAME}" \
            --notes-file /tmp/release-notes.md \
            --latest
          gh release upload latest \
            app/build/outputs/apk/release/*.apk \
            metadata.json
        env:
          GH_TOKEN: ${{ github.token }}
