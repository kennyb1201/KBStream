name: Refresh CA bundle

# The Mozilla CA roots MPV verifies https against (app/src/main/assets/
# cacert.pem, staged by MpvPlayerView.prepareTlsCaFile) are a snapshot: CAs
# rotate and expire, so a bundle left alone long enough stops trusting sites
# that are still valid - and because libmpv has no system trust store, a stale
# or unusable bundle fails every https handshake exactly like shipping none did.
# This refreshes it from the canonical source on a schedule.
#
# It opens a PR rather than committing to main on purpose: a push performed
# with the workflow's own GITHUB_TOKEN does not trigger any other workflow
# (GitHub suppresses those events to avoid recursion), so a direct bot commit
# would land UNGATED. A PR reviewed and merged by a person produces a normal
# push to main, which runs build.yml's full gate - ktlint, the unit suite
# (including MpvTlsCaContractTest), lint and the APK builds - over the new
# bundle. An empty schedule run (the bundle is unchanged) simply does nothing.
#
# curl.se regenerates cacert.pem at a slow cadence, so monthly is ample; the
# manual dispatch exists to pull a fix (a revoked CA, a broken upstream) on
# demand without waiting for the schedule.

on:
  schedule:
    # Monthly, on the 1st, off the hour.
    - cron: "17 4 1 * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the current Mozilla roots
        run: |
          set -euo pipefail
          curl -fsSL --max-time 60 https://curl.se/ca/cacert.pem -o /tmp/cacert.pem
          echo "downloaded $(wc -c < /tmp/cacert.pem) bytes"

      # Validate the download before it can reach the app. A truncated file, an
      # HTML error page served with a 200, or a mangled PEM must never be
      # committed: with no usable roots every https handshake in the MPV engine
      # fails, which is precisely the outage the bundle exists to prevent. This
      # is also the only structural check the PR's own diff does not provide.
      - name: Validate the bundle
        run: |
          set -euo pipefail
          test "$(wc -c < /tmp/cacert.pem)" -gt 50000
          grep -q 'BEGIN CERTIFICATE' /tmp/cacert.pem
          grep -q 'END CERTIFICATE' /tmp/cacert.pem
          # openssl parses it: a malformed PEM fails here rather than on a TV.
          openssl crl2pkcs7 -nocrl -certfile /tmp/cacert.pem \
            | openssl pkcs7 -print_certs -noout > /dev/null
          echo "bundle parses; certificates: $(grep -c 'BEGIN CERTIFICATE' /tmp/cacert.pem)"

      - name: Open a PR when the bundle changed
        run: |
          set -euo pipefail
          cp /tmp/cacert.pem app/src/main/assets/cacert.pem
          if git diff --quiet -- app/src/main/assets/cacert.pem; then
            echo "CA bundle is already current; nothing to do."
            exit 0
          fi

          BRANCH="chore/refresh-ca-bundle"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add app/src/main/assets/cacert.pem
          git commit -m "Refresh the bundled Mozilla CA roots"
          # Force is safe here: the branch is single-purpose and always holds
          # exactly this one regenerated file, so a previous proposal - already
          # merged, or superseded by a newer bundle - is meant to be replaced.
          git push --force origin "$BRANCH"

          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$EXISTING" ]]; then
            echo "Updated the existing PR (#$EXISTING) for $BRANCH."
            exit 0
          fi

          # A multi-line string kept as a double-quoted value: each continuation
          # line sits at the block's own indent, so the YAML strip leaves the
          # text flush (a here-doc here would keep its indentation and gh would
          # render it into the PR body).
          BODY="Automated refresh of app/src/main/assets/cacert.pem from
          <https://curl.se/ca/cacert.pem>, the canonical Mozilla root bundle.

          MPV verifies https against this bundle (libmpv has no access to
          Android's system trust store - see MpvPlayerView.prepareTlsCaFile),
          so keeping it current is what keeps https playback working as CAs
          rotate.

          The workflow validated the download before opening this PR (size,
          PEM markers and an openssl parse). Merging runs build.yml's full gate
          over the new bundle, including MpvTlsCaContractTest."

          gh pr create --base main --head "$BRANCH" \
            --title "Refresh the bundled Mozilla CA roots" \
            --body "$BODY"
        env:
          GH_TOKEN: ${{ github.token }}
