# Baseline profile generation (F2, spec 2026-11-20).
#
# The profile is INPUT to the release build, not a build product: without it the
# app still works, it just runs its first frames interpreted. The generator lives
# in :baselineprofile and writes
# app/src/release/generated/baselineProfiles/baseline-prof.txt
# (see `baselineProfile { saveInSrc = true }` in app/build.gradle.kts), which is
# committed.
#
# This job is how that file gets refreshed without a PC: it boots an Android
# emulator on the runner, runs the generator against :app, and puts the result
# on a branch as a pull request. Merging that is what makes every later build
# carry it - the release build picks the file up from the source tree, so the
# next tag ships it inside assets/dexopt/baseline.prof.
#
# NOT part of every build, deliberately: a release must not depend on an emulator
# being available, and the profile only moves when startup-path code moves. It
# runs monthly instead, which is the cheap half of keeping it honest - no list of
# "startup files" to maintain, no per-PR judgement about whether a change is big
# enough to matter, and a diff to review when it does change.
#
# A TV box still produces a more faithful traversal (D-pad focus is part of what
# is captured), so with one attached `./gradlew :app:generateBaselineProfile`
# remains the better path - and the artifact is still uploaded if that is how you
# want to take the file.
name: Baseline profile

on:
  workflow_dispatch:
  # 04:00 UTC on the 1st of each month. An emulator run costs ~30-60 minutes, so
  # this is not something to do more often; monthly is frequent enough that a
  # startup-path change is never more than one release cycle away from a
  # refreshed profile.
  schedule:
    - cron: '0 4 1 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --- MPV engine native library ----------------------------------------
      # This job configures :app, and :app cannot even CONFIGURE without the MPV
      # AAR: the dependency block throws (MpvBackend imports is.xyz.mpv.MPV from
      # it), so the first dispatch of this workflow died before a single task
      # ran with "The MPV engine AAR is missing at
      # app/libs/mpv-android-lib-libdovi.aar". The release workflow fetches it;
      # this one has to as well.
      #
      # Same cache key as build.yml, so a runner that already built a release
      # restores the ~155 MB AAR instead of downloading it, and the script
      # re-verifies the digest and the 16 KB alignment either way.
      - name: Cache MPV engine AAR
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: app/libs/mpv-android-lib-libdovi.aar
          key: mpv-aar-${{ runner.os }}-b19d39a7b4d1c65b

      - name: Fetch MPV engine AAR
        run: bash scripts/fetch_mpv_aar.sh

      # The same dependency cache the release workflow uses, keyed the same way,
      # so a runner that built a release restores it instead of resolving every
      # plugin and artifact again. That is mostly speed - this job also builds
      # the app it profiles - but it is also the failure that killed one run:
      # `Plugin [id: 'com.google.devtools.ksp', version: '2.3.12'] was not found`
      # while the very same commit resolved it minutes earlier, i.e. a repository
      # hiccup on a cold cache. A warm cache means fewer requests to hiccup on.
      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
            ~/.gradle/caches/9.8.0
            ~/.gradle/wrapper/dists
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-

      # KVM on the runner is what makes an x86_64 emulator usable rather than
      # unusably slow; without it the emulator boots in software rendering and
      # the capture times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The generator INSTALLS the app it just built, and the variant it
      # installs inherits the release signing config - which is empty unless the
      # KBSTREAM_* variables are set (README > Baseline profile: the run then
      # stops at install with INSTALL_PARSE_FAILED_NO_CERTIFICATES and nothing
      # mentions signing). A throwaway key is enough: the APK is only ever
      # installed on this emulator and then thrown away with the runner.
      - name: Create a throwaway signing key
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/capture.jks" \
            -storetype JKS -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 1000 \
            -dname "CN=KBStream baseline capture, O=KBStream, C=US"

      # `-Pkbstream.captureAbi=x86_64` is what makes the capture APK
      # installable HERE: release is deliberately ARM-only (arm64-v8a and
      # armeabi-v7a), and this runner's emulator is x86_64. The property adds
      # the emulator ABI for this build only - a released APK never passes it.
      - name: Generate the profile
        uses: reactivecircus/android-emulator-runner@v2
        env:
          KBSTREAM_STORE_FILE: ${{ runner.temp }}/capture.jks
          KBSTREAM_STORE_PASSWORD: android
          KBSTREAM_KEY_ALIAS: androiddebugkey
          KBSTREAM_KEY_PASSWORD: android
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:generateBaselineProfile -Pkbstream.captureAbi=x86_64 --stacktrace

      - name: Upload the profile
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: app/src/release/generated/baselineProfiles/baseline-prof.txt
          if-no-files-found: error

      # The file has to come BACK, or the schedule is pointless: an artifact
      # nobody downloads is how this path stayed empty for every release so far.
      # A branch + pull request rather than a commit to main, so the refreshed
      # profile is a diff someone merges - and so a run can never rewrite main on
      # its own.
      - name: Open a pull request if the profile changed
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: app/src/release/generated/baselineProfiles/baseline-prof.txt
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Catches an untracked file as well as a modified one: the first run
          # ever writes this path, so a plain `git diff` would see nothing.
          if [ -z "$(git status --porcelain -- "$PROFILE")" ]; then
            echo "The generated profile matches the committed one - nothing to refresh."
            exit 0
          fi
          BRANCH="baseline-profile/refresh"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -- "$PROFILE"
          git commit -m "Refresh the baseline profile"
          git push --force origin "$BRANCH"
          if gh pr list --head "$BRANCH" --state open --json number --jq '.[].number' | grep -q .; then
            echo "A refresh pull request is already open; this run's profile is on its branch."
          else
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "Refresh the baseline profile" \
              --body "Generated on the emulator by the Baseline profile workflow.\n\nMerging this is what makes the next build ship \`assets/dexopt/baseline.prof\`; without it the app still works, it just runs its first frames interpreted. A TV-captured profile is more faithful for D-pad traversal - run \`:app:generateBaselineProfile\` with the box attached if a capture matters more than freshness."
          fi
