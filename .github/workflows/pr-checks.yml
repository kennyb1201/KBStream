name: PR checks

# The gate Dependabot PRs were missing.
#
# build.yml only runs on a push to main, a v* tag, or a manual dispatch, so
# every pull request -- Dependabot's upgrade PRs included -- showed up
# "mergeable" with zero checks attached, and a merge was the first time
# anything built it. That is how a grouped "minor/patch" bump carrying Kotlin
# 2.4, KSP 2.3.12 and media3 1.11 reached main's doorstep looking routine: the
# KSP/AGP pair it contained cannot even configure (NoSuchMethodError on
# addKspConfigurations), and nothing said so.
#
# Deliberately NOT build.yml run on pull_request. Dependabot-triggered runs
# receive no repository secrets, so its keystore, Sentry-mapping and publish
# steps would fail for reasons that have nothing to do with the bump, and a
# red check that means "no secrets" is worse than no check at all.
#
# What runs here are the gates that need neither a secret nor a device:
# ktlint, Android Lint, the JVM unit suite, and - as its own named job - the
# phone port's contract tests, so a port regression is attributable rather than
# one line inside the full suite. (Lint used to run only on
# build.yml's push to main, so a lint error could land on main unremarked and
# only surface on the next push; it is cheap enough on a PR runner to gate
# here too.) The FFmpeg video extension is deliberately
# not built -- the app falls back to the published audio-only decoder, exactly
# as a local build does, and nothing in the unit suite plays video.
on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: "17"
          distribution: temurin

      # Dependency caching only, same as build.yml: a fresh runner would
      # otherwise re-download the whole AGP/Compose/media3 dependency graph for
      # a lint-and-test run. app/build is never restored and org.gradle.caching
      # stays off, so every task below still executes for real.
      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
            ~/.gradle/caches/9.8.0
            ~/.gradle/wrapper/dists
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          # platform-tools only: the action's default package set still names
          # the legacy `tools` package Google removed from the SDK repository.
          # AGP fetches platforms/build-tools itself once licenses are accepted.
          packages: platform-tools

      # The MPV engine AAR is a file dependency, not a Maven one, so a fresh
      # checkout has no native library and the app cannot compile. Fetch it the
      # same way build.yml does - verified against the published .sha256 and the
      # digest pinned in the script.
      - name: Fetch MPV engine AAR
        run: bash scripts/fetch_mpv_aar.sh

      - name: Lint, Android Lint and unit tests
        run: ./gradlew ktlintCheck lintDebug testDebugUnitTest --console=plain --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"

  # The phone port's own gate, beside the full suite above.
  #
  # The port is guarded by CONTRACT tests: they read the TV and phone sources
  # and pin the joins that cannot be seen at runtime on a JVM - the form-factor
  # branch, "this control writes the same pref the TV one does", the one-shot
  # hand-offs, the read-only cards. Those tests already run inside
  # `check`'s full suite, so this job adds no coverage; what it adds is
  # ATTRIBUTION. A regression that lands here turns the port red by name, with
  # only the port's own tests in the log, instead of being one line in a 5,000-
  # test run - which is what makes the failure readable enough to act on before
  # a device run.
  #
  # Same setup as `check` and for the same reasons (dependency cache only, the
  # MPV AAR is a file dependency, no secrets, no device). The test filters cover
  # the phone screens, the shared Settings contracts they are pinned by, and the
  # KB/Home contracts that decide what the phone draws.
  phone-port:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          java-version: "17"
          distribution: temurin

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/caches/jars-9
            ~/.gradle/caches/9.8.0
            ~/.gradle/wrapper/dists
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platform-tools

      - name: Fetch MPV engine AAR
        run: bash scripts/fetch_mpv_aar.sh

      - name: Phone port contract tests
        run: >
          ./gradlew :app:testDebugUnitTest
          --tests 'com.kennyb1201.kbstream.ui.mobile.*'
          --tests 'com.kennyb1201.kbstream.ui.settings.*'
          --tests 'com.kennyb1201.kbstream.data.kb.HomeBuiltinRailWiringContractTest'
          --console=plain --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
