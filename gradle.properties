android.useAndroidX=true
android.enableJetifier=false

# Memory: this project builds inside a memory-capped container (4 GiB here)
# while the MACHINE the JVMs can see is far larger (64 cores, hundreds of GB of
# RAM). Gradle sizes its heap and its worker pool from the machine, not from the
# cap, and its heaviest steps - dex building, the L8 desugar step, dex merging
# and packaging - allocate hundreds of MB at once. With the old settings
# (-Xmx4g, a 1 GiB metaspace, one worker per core) the daemon's own anonymous
# memory reached ~3.4 GiB, the cgroup hit its limit mid-build, and the kernel
# OOM-killed the daemon - which the client reports as "Gradle build daemon
# disappeared unexpectedly", with no crash log, because a SIGKILL writes none.
#
# 3g is what the whole build fits in now that the compiler runs in this JVM
# too (see below): measured peak resident for a clean :app:assembleDebug is
# ~3.2 GiB of the 4 GiB cap, with no OOM kills.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:MaxDirectMemorySize=256m -XX:+UseParallelGC -XX:ActiveProcessorCount=2 -XX:ReservedCodeCacheSize=128m

# nproc reports the host's 64 cores while this container is allowed 2, so the
# default (one worker per core) runs many dex/merge workers at once, each with
# its own buffers. One at a time is all a 2-CPU quota can use, and it is the
# single biggest saving in peak memory.
#
# CI overrides this per invocation with --max-workers (see GRADLE_MAX_WORKERS
# in .github/workflows/build.yml): a runner has four real cores and the RAM to
# keep them fed, so it can run dex/merge/compile work concurrently. The value
# here is the local-build default.
org.gradle.workers.max=1

# Compile Kotlin inside the Gradle daemon rather than in a second JVM.
#
# Why not the Kotlin daemon: a clean compile (no build directory, as on a fresh
# CI checkout) needs more than the 1 GiB that used to be configured for it, and
# the compiler dies with an OutOfMemoryError partway through IR lowering /
# codegen - the crash that prompted this, reported as
#
#   Backend Internal error: Exception during IR lowering ...
#   The root cause java.lang.OutOfMemoryError ...
#
# on whichever file the backend happened to be lowering when it ran out
# (ActorScreen.kt in CI; AddonsScreen.kt, whose generated composable runs to
# thousands of instructions, when reproduced here). Incremental builds never
# showed it because they only recompile the files that changed.
#
# The ~2 GiB clean compilation actually wants cannot be handed to a second JVM
# in this container either, and that is the part that makes the Kotlin daemon
# the wrong tool here: it is sized from the machine, and it outlives the
# compile by two hours, holding its heap. Measured in this container, a 2 GiB
# Kotlin daemon is OOM-killed by the kernel mid-compile ("Connection to the
# Kotlin daemon has been unexpectedly lost"), and even at 1.5 GiB the daemon
# (1.95 GiB resident) plus the Gradle daemon (2.2 GiB) sit above the 4 GiB cap,
# so the dex step that follows a compile - the step the settings above were
# tuned for - gets its daemon killed instead.
#
# In-process keeps the whole build in one JVM: the compiler gets this daemon's
# 3 GiB instead of a starved 1 GiB, and nothing is left alive to starve dexing
# afterwards. Trade-off: the compiler is no longer kept warm in its own daemon
# between builds, so the first compile of a session costs a little more.
#
# Runners are far larger than this container and pass a bigger daemon heap (and
# a higher ActiveProcessorCount) on the command line - see
# GRADLE_DAEMON_JVMARGS in .github/workflows/build.yml.
kotlin.compiler.execution.strategy=in-process
