android.useAndroidX=true
android.enableJetifier=false
# Sandbox-friendly memory limits (4G default OOM-kills CI/containers with <8G RAM).
# D8/dexing needs the headroom; the Kotlin daemon gets its own smaller cap.
org.gradle.jvmargs=-Xmx1400m -XX:MaxMetaspaceSize=512m
org.gradle.workers.max=1
kotlin.daemon.jvmargs=-Xmx400m
