# KBStream version catalog.
#
# The single source of truth for every third-party coordinate the build
# resolves: a version bump is now one line here instead of a search across the
# two module build scripts and their plugin blocks. app/build.gradle.kts only
# carries the comments (why a version is what it is); this file carries the
# version.
#
# Modules whose version a BOM owns (Compose, supabase-kt) are listed WITHOUT a
# `version.ref` on purpose - the BOM's `version.ref` is the single source of
# truth for the whole group, exactly as it was when the BOM was imported.

[versions]
# --- Build toolchain (plugin versions; see [plugins]) ---
agp = "9.5.0"
kotlin = "2.4.21"
ksp = "2.3.12"
sentry-gradle = "6.25.0"
ktlint = "14.2.0"
baseline-profile = "1.5.0"

# --- AndroidX / Compose ---
core-ktx = "1.19.1"
security-crypto = "1.1.0"
activity-compose = "1.13.0"
lifecycle = "2.11.0"
paging-compose = "3.5.3"
compose-bom = "2026.09.00"
tv-material = "1.1.0"
tv-foundation = "1.0.0"
profileinstaller = "1.4.1"
# Not a layout system this app adopted: a ConstraintLayout is used for exactly
# one view - the player's clearlogo slot - because it is the only container in
# the framework that can express "as wide as the header, never wider than the
# TV's 400dp". `layout_constraintWidth_max` has no LinearLayout/FrameLayout
# equivalent, and the fixed box it replaces clipped the art on phones (see
# player_chrome.xml). Nothing else in the app draws with it.
constraintlayout = "2.2.2"
recyclerview = "1.4.0"
room = "2.8.5"
work = "2.12.0"
# The preference files' new home (spec 2026-11-22, DataStore). 1.3.0 is the
# current stable release; the shim needs SharedPreferencesMigration from this
# artifact to adopt the existing XML stores, which every 1.x line ships.
datastore = "1.3.0"
# Hilt, for the dependency graph that replaces the getInstance companions
# (spec 2026-11-22, item 3). 2.60.1 is the current release; its plugin is built
# against Kotlin 2.3.21 and pairs with this tree's KSP (2.3.x / Kotlin 2.4).
hilt = "2.60.1"
# AndroidX's bridge between Hilt and Compose (spec 2026-11-22, item 3). Its
# `hiltViewModel()` is what lets a screen change one default argument instead of
# every call site: the ViewModel comes from the activity's entry point, so the
# constructor stops being the caller's business. This is the navigation-free
# artifact on purpose - `hilt-navigation-compose` would pull navigation-compose
# in months before the navigation migration (item 5) is allowed to start.
hilt-compose = "1.4.0"
# Tink, for the encrypted token store's keyset (spec 2026-11-22, DataStore
# phase 3). 1.8.0 is the version androidx.security:security-crypto 1.1.0 already
# resolves; pinned explicitly because this module now uses its API directly and
# the keyset format must not drift under an existing key.
tink = "1.8.0"
# okio: datastore-tink's serializer speaks BufferedSource/BufferedSink, and this
# module names those types. Already present at runtime through DataStore.
okio = "3.9.1"
# Play In-App Updates, for the Play-distributed build only (`-PplayBuild`).
# A Play install cannot install its own APK, so its updates come from the
# store through this library's flexible flow - see PlayUpdater. The sideloaded
# release never calls it and R8 strips it (PLAY_BUILD is false there).
play-app-update = "2.1.0"
# Not a UI system this app adopted either: nothing here extends a Fragment. It
# is pinned because app-update brings play-services-basement 18.1.0, whose POM
# declares androidx.fragment 1.0.0 - and androidx.activity refuses to use
# ActivityResult APIs against a Fragment older than 1.3.0 (before it,
# FragmentActivity never called super.onRequestPermissionsResult, so result
# callbacks could be dropped). Upgrading that transitive copy rather than
# excluding it keeps basement's LifecycleActivity/SupportFragmentWrapper
# resolvable, since they really do reference androidx.fragment.
fragment = "1.9.1"

# --- HTTP / JSON / images ---
retrofit = "3.0.0"
okhttp = "5.5.1"
moshi = "1.15.2"
zxing = "3.5.4"
coil = "3.6.3"

# --- Playback / sync / reporting ---
media3 = "1.11.1"
newpipe-extractor = "43f8e6ebeef4"
sentry = "8.62.0"
supabase = "3.9.0"
ktor = "3.6.1"
# The TV's local remote-control server: a WebSocket server in ~100 KB. Ktor
# server is not in the catalog (only ktor-client-okhttp), and a hand-rolled
# RFC 6455 server is more code than this feature should own.
nanohttpd = "2.3.1"
kotlinx-serialization = "1.12.0"
desugar = "2.1.5"

# --- Tests / debug tooling ---
junit = "4.13.2"
json = "20260814"
robolectric = "4.17"
androidx-test-junit = "1.3.0"
androidx-test-core = "1.7.0"
leakcanary = "2.14"
uiautomator = "2.4.0"
benchmark-macro = "1.5.0"

[libraries]
# --- AndroidX core / UI ---
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "security-crypto" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging-compose" }
androidx-profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-tv-material = { module = "androidx.tv:tv-material", version.ref = "tv-material" }
google-play-app-update = { module = "com.google.android.play:app-update", version.ref = "play-app-update" }
androidx-tv-foundation = { module = "androidx.tv:tv-foundation", version.ref = "tv-foundation" }

# --- Compose (versions owned by androidx-compose-bom) ---
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-runtime = { module = "androidx.compose.runtime:runtime" }
androidx-compose-ui-base = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling-debug = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# --- Room / Work ---
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-datastore-tink = { module = "androidx.datastore:datastore-tink", version.ref = "datastore" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
# Hilt (spec 2026-11-22, item 3). The graph is introduced FIRST and delegates to
# the existing getInstance singletons, so there is one instance of everything at
# every point of the migration; classes move onto it one at a time and the
# companions are deleted last.
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "hilt-compose" }

# --- HTTP / JSON ---
retrofit-core = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-moshi = { module = "com.squareup.retrofit2:converter-moshi", version.ref = "retrofit" }
okhttp-core = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
okhttp-brotli = { module = "com.squareup.okhttp3:okhttp-brotli", version.ref = "okhttp" }
moshi-kotlin = { module = "com.squareup.moshi:moshi-kotlin", version.ref = "moshi" }
nanohttpd-websocket = { module = "org.nanohttpd:nanohttpd-websocket", version.ref = "nanohttpd" }
moshi-codegen = { module = "com.squareup.moshi:moshi-kotlin-codegen", version.ref = "moshi" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }

# --- Media3 ---
media3-exoplayer-core = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { module = "androidx.media3:media3-exoplayer-hls", version.ref = "media3" }
media3-exoplayer-dash = { module = "androidx.media3:media3-exoplayer-dash", version.ref = "media3" }
media3-exoplayer-rtsp = { module = "androidx.media3:media3-exoplayer-rtsp", version.ref = "media3" }
media3-exoplayer-smoothstreaming = { module = "androidx.media3:media3-exoplayer-smoothstreaming", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-datasource-okhttp = { module = "androidx.media3:media3-datasource-okhttp", version.ref = "media3" }
# Declared explicitly rather than relied on transitively: offline downloads are
# the one feature that names classes out of both of these modules directly
# (StandaloneDatabaseProvider for the download index, SimpleCache /
# CacheDataSource for the bytes), so the modules the code depends on are the
# modules the build asks for. Both are already on the classpath through
# media3-exoplayer's own api dependencies at the same version.ref.
media3-database = { module = "androidx.media3:media3-database", version.ref = "media3" }
media3-datasource = { module = "androidx.media3:media3-datasource", version.ref = "media3" }

# --- Playback engines / stream extraction ---
# The MPV engine's native library is no longer a Maven coordinate: it is the
# fortunasxp `mpv-android-libdovi` release AAR (libplacebo built with -Ddovi),
# digest-pinned and fetched into app/libs/ by scripts/fetch_mpv_aar.sh, and
# consumed as a file dependency (see app/build.gradle.kts). It replaced the
# Riteshp2001/mpvlibAndroid (Mpv∞) build on 2026-10-15; the `libmpv` alias
# dev.jdtech.mpv:libmpv used to live here and is deliberately retired - nothing
# may point back at it. m35: this comment still named the old engine.
# `io.github.abdallahmehiz:mpv-android-lib` used to be aliased here as a second,
# build-time-chosen MPV engine backend. It was trialled for the `vo=gpu`
# black-screen failure and removed: it produced the same black screen, so the
# library was not the variable. Nothing resolves it now.
newpipe-extractor = { module = "com.github.TeamNewPipe:NewPipeExtractor", version.ref = "newpipe-extractor" }

# --- Coil ---
coil-core = { module = "io.coil-kt.coil3:coil", version.ref = "coil" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
coil-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil" }
coil-gif = { module = "io.coil-kt.coil3:coil-gif", version.ref = "coil" }

# --- Crash reporting / sync / serialization ---
sentry-android = { module = "io.sentry:sentry-android", version.ref = "sentry" }
supabase-bom = { module = "io.github.jan-tennert.supabase:bom", version.ref = "supabase" }
supabase-auth = { module = "io.github.jan-tennert.supabase:auth-kt" }
supabase-postgrest = { module = "io.github.jan-tennert.supabase:postgrest-kt" }
supabase-realtime = { module = "io.github.jan-tennert.supabase:realtime-kt" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
desugar-jdk-libs-nio = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugar" }

# --- Tests / debug tooling ---
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
androidx-test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "androidx-test-core" }
leakcanary-android = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark-macro" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
sentry-android-gradle = { id = "io.sentry.android.gradle", version.ref = "sentry-gradle" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
baseline-profile = { id = "androidx.baselineprofile", version.ref = "baseline-profile" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
