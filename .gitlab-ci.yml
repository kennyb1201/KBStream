stages:
  - build

variables:
  ANDROID_SDK_ROOT: "/sdk"
  ANDROID_HOME: "/sdk"
  ANDROID_COMPILE_SDK: "35"
  ANDROID_BUILD_TOOLS: "34.0.0"
  ANDROID_SDK_TOOLS: "11076708"

android-build:
  stage: build
  image: eclipse-temurin:17
  before_script:
    - apt-get update && apt-get install -y wget unzip
    - mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
    - wget -q --output-document="$ANDROID_SDK_ROOT/cmdline-tools.zip" https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_SDK_TOOLS}_latest.zip
    - unzip -q "$ANDROID_SDK_ROOT/cmdline-tools.zip" -d "$ANDROID_SDK_ROOT/cmdline-tools"
    - mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
    - export PATH="$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools"
    - yes | sdkmanager --licenses
    - sdkmanager "platform-tools" "platforms;android-${ANDROID_COMPILE_SDK}" "build-tools;${ANDROID_BUILD_TOOLS}"
    - chmod +x ./gradlew
  script:
    - ./gradlew assembleDebug --stacktrace --console=plain
  artifacts:
    when: always
    paths:
      - app/build/outputs/