<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  fontconfig configuration for the in-app libass renderer.

  Android has no fontconfig config, and libass's font resolution goes through
  fontconfig - so without this file the renderer can only use the fonts a
  media file embeds, which is the opposite of what it is here for (a fansub
  .ass names family "Noto Sans CJK", "Source Han Sans" and friends, and the
  system already has them). The list below is every directory an Android or
  Android TV image keeps fonts in, including the product/vendor partitions
  and the per-device /data/fonts overlay the OEMs use.

  fontconfig will not write inside those directories (they are read-only), and
  it needs a writable cache: the app copies this file into its own filesDir
  and points FONTCONFIG_FILE at the copy, with XDG_CACHE_HOME set to the app
  cache dir, so the cache lands there too.

  Deliberately NOT included: /system/etc/fonts.xml. That file is Android's own
  font configuration and uses a completely different schema; handing it to
  fontconfig is a parse error, not a font list.
-->
<fontconfig>
    <dir>/system/fonts</dir>
    <dir>/system/font</dir>
    <dir>/product/fonts</dir>
    <dir>/vendor/fonts</dir>
    <dir>/data/fonts</dir>

    <!-- A missing directory must not abort the scan: product and vendor
         partitions are absent on plenty of TV boxes. -->
    <config></config>
</fontconfig>
