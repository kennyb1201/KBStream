# Robolectric runs against API 35, not the manifest's targetSdk.
#
# The app targets API 36 (required for Play phone/tablet updates since
# 2026-08-31 - see app/build.gradle.kts). Robolectric picks its sandbox SDK from
# the manifest's targetSdkVersion by default, and its API-36 sandbox needs Java
# 21; the project (and CI) build and test on Java 17, so without this every
# Robolectric test fails with "Failed to create a Robolectric sandbox: Android
# SDK 36 requires Java 21 (have Java 17)".
#
# API 35 is the newest sandbox Java 17 can run, and is plenty for these tests -
# they exercise app logic, not API-36 platform behavior. A test that needs a
# different level can still override this with @Config(sdk = [...]).
sdk=35
